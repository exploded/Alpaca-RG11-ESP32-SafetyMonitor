; PlatformIO Project Configuration File
;
; ASCOM Alpaca SafetyMonitor — Hydreon RG-11 rain sensor
; ESP32-WROOM-32 DevKit (30-pin) on a screw-terminal expansion board
; + GC9A01 1.28" round TFT (240x240).
;
; The display seats directly onto the first seven header pins — its header
; order (VCC GND SCL SDA DC CS RST) matches the board silkscreen
; (3V3 GND D15 D2 D4 D16 D17) one-to-one. See README.md.
;
; TFT_eSPI is configured entirely through build flags below, so no
; User_Setup.h edit is needed and the config travels with the repo.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; debug build – required so the exception decoder can show function names +
; line numbers. No IRAM pressure on ESP32, so this costs nothing.
build_type = debug

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI config (no User_Setup.h edits) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=2
    -DTFT_SCLK=15
    -DTFT_CS=16
    -DTFT_DC=4
    -DTFT_RST=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; GPIO2 doubles as the onboard D2 LED, which loads MOSI — keep the SPI
    ; clock conservative rather than taking the library default.
    -DSPI_FREQUENCY=27000000
